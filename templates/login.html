{% extends "base.html" %}
{% block title %}Console Authentication{% endblock %}

{% block content %}
<main class="container">
  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-header">
        <div class="auth-icon-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 class="hero-title" style="font-size:1.6rem;margin-bottom:6px;">Console Sign In</h1>
        <p style="color:var(--text-muted);font-size:0.88rem;">Authenticate to manage repository publications</p>
      </div>

      <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input id="username" class="form-input" name="username" type="text"
                 required autofocus autocomplete="username" placeholder="admin">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input id="password" class="form-input" name="password" type="password"
                 required autocomplete="current-password" placeholder="••••••••">
        </div>

        <button class="btn btn-primary" type="submit" style="width:100%;margin-top:8px;padding:11px;">
          <span>Authenticate</span>
        </button>
      </form>

      <p style="color:var(--text-faint);font-size:0.78rem;text-align:center;margin-top:24px;">
        Public articles are open-access and do not require authentication.
      </p>

    </div>
  </div>
</main>
{% endblock %}
